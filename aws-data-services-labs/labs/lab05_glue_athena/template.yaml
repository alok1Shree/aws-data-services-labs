AWSTemplateFormatVersion: "2010-09-09"
Description: Lab 05 - S3 data lake, Glue catalog + crawler, Athena workgroup with a scan cap
Resources:
  LakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: orders_lake
  CrawlerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: glue.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: read-raw
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource: [!GetAtt LakeBucket.Arn, !Sub "${LakeBucket.Arn}/raw/*"]
  OrdersCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: orders-raw-crawler
      Role: !GetAtt CrawlerRole.Arn
      DatabaseName: !Ref GlueDatabase
      Targets:
        S3Targets:
          - Path: !Sub "s3://${LakeBucket}/raw/orders/"
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG
  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: labs
      State: ENABLED
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        BytesScannedCutoffPerQuery: 1073741824 # hard stop at 1 GB scanned per query = bounded cost
        ResultConfiguration:
          OutputLocation: !Sub "s3://${LakeBucket}/athena-results/"
Outputs:
  BucketName:
    Value: !Ref LakeBucket
